name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/caseythecoder90/grindtrack

jobs:
  # --- PR + push gates ---------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify runs spotless:check too — formatting violations fail the build
      - run: mvn -B verify
        working-directory: gt2/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gt2/frontend/package-lock.json
      - run: npm ci
        working-directory: gt2/frontend
      # build = tsc --noEmit (strict) + vite build
      - run: npm run build
        working-directory: gt2/frontend

  # --- Build the image and push to GHCR (main only) ----------------------------
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: gt2               # Dockerfile COPYs frontend/ and backend/ from here
          file: gt2/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- Roll out the new image on the Kubernetes cluster ------------------------
  # Cluster lives in the k8s-cluster-hetzner repo. KUBE_CONFIG is a base64
  # kubeconfig for the least-privilege `ci-deployer` ServiceAccount in the
  # grindtrack namespace — it can update Deployment images there and nothing
  # else (no Secret access, no other namespaces).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Skip gracefully if the cluster secret isn't configured, so merges to
      # main don't show a red X before deployment is set up.
      - name: Check deploy secrets
        id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG not set — skipping deploy."
          fi

      - name: Set up kubectl
        if: steps.check.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.13          # matches the cluster

      - name: Configure cluster access
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out the new image
        if: steps.check.outputs.configured == 'true'
        run: |
          # short SHA matches docker/metadata-action's `type=sha,prefix=` tag
          TAG=${GITHUB_SHA::7}
          kubectl -n grindtrack set image deploy/grindtrack \
            app=ghcr.io/caseythecoder90/grindtrack:$TAG
          # readiness probe hits /api/public/stats, so a successful rollout
          # already proves the app is healthy — no separate health loop needed
          kubectl -n grindtrack rollout status deploy/grindtrack --timeout=300s

      - name: Show pod state if the rollout failed
        if: failure()
        run: |
          kubectl -n grindtrack get pods -l app=grindtrack
          kubectl -n grindtrack logs -l app=grindtrack --tail=100 || true
