<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="759px" preserveAspectRatio="none" style="width:987px;height:759px;background:#FFFFFF;" version="1.1" viewBox="0 0 987 759" width="987px" zoomAndPan="magnify"><defs/><g><!--class events--><g class="entity" data-entity="events" data-source-line="24" data-uid="ent0002" id="entity_events"><rect fill="#E8E0FF" height="287.2734" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="327.7261" x="7" y="281"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="95.3989" x="123.1636" y="299.4951">calendar_events</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="333.7261" y1="307.3516" y2="307.3516"/><ellipse cx="18" cy="321.0273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="26" y="324.8467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="333.7261" y1="331.7031" y2="331.7031"/><ellipse cx="18" cy="345.3789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.7617" x="26" y="349.1982">title : varchar(300)</text><ellipse cx="18" cy="361.7305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8799" x="26" y="365.5498">kind : varchar(20)  CHECK</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="286.895" x="26" y="381.9014">appointment | study_block | work_block | personal</text><ellipse cx="18" cy="394.4336" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.4707" x="26" y="398.2529">event_date : date</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="206.6099" x="26" y="414.6045">start_time : time  (NULL *is* all-day)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="88.8735" x="26" y="430.9561">end_time : time</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.9741" x="26" y="447.3076">plan_item_id : bigint &#171;FK &#8594; plan_items, SET NULL&#187;</text><ellipse cx="18" cy="459.8398" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.0801" x="26" y="463.6592">notes : text  (default '')</text><ellipse cx="18" cy="476.1914" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2388" x="26" y="480.0107">created_at / updated_at : timestamptz</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="333.7261" y1="486.8672" y2="486.8672"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="178.4517" x="13" y="504.3623">CHECK end_time IS NULL OR</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="309.5625" x="13" y="520.7139">(start_time IS NOT NULL AND end_time &gt; start_time)</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="333.7261" y1="527.5703" y2="527.5703"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.5171" x="13" y="545.0654">idx (event_date, start_time)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="315.7261" x="13" y="561.417">idx (plan_item_id) WHERE plan_item_id IS NOT NULL</text></g><!--class tasks--><g class="entity" data-entity="tasks" data-source-line="44" data-uid="ent0003" id="entity_tasks"><rect fill="#E8E0FF" height="213.8672" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="379.0913" x="501.5" y="7"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="88.8672" x="646.6121" y="25.4951">recurring_tasks</text><line style="stroke:#181818;stroke-width:0.5;" x1="502.5" x2="879.5913" y1="33.3516" y2="33.3516"/><ellipse cx="512.5" cy="47.0273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="520.5" y="50.8467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="502.5" x2="879.5913" y1="57.7031" y2="57.7031"/><ellipse cx="512.5" cy="71.3789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.7617" x="520.5" y="75.1982">title : varchar(200)</text><ellipse cx="512.5" cy="87.7305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.8926" x="520.5" y="91.5498">category : varchar(20)  CHECK</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="176.103" x="520.5" y="107.9014">pet | home | health | car | other</text><ellipse cx="512.5" cy="120.4336" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="197.9834" x="520.5" y="124.2529">interval_days : int  CHECK 1-3650</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="353.0376" x="520.5" y="140.6045">last_done_on : date  (NULL = never done, reads as due now)</text><ellipse cx="512.5" cy="153.1367" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="354.0913" x="520.5" y="156.9561">active : boolean  (kept, not deleted, so history stays readable)</text><ellipse cx="512.5" cy="169.4883" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="127.0801" x="520.5" y="173.3076">notes : text  (default '')</text><ellipse cx="512.5" cy="185.8398" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2388" x="520.5" y="189.6592">created_at / updated_at : timestamptz</text><line style="stroke:#181818;stroke-width:1;" x1="502.5" x2="879.5913" y1="196.5156" y2="196.5156"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="148.1416" x="507.5" y="214.0107">idx (active, last_done_on)</text></g><!--class completions--><g class="entity" data-entity="completions" data-source-line="59" data-uid="ent0004" id="entity_completions"><rect fill="#E8E0FF" height="148.4609" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="320.166" x="370" y="350.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="158.9644" x="450.6008" y="368.9951">recurring_task_completions</text><line style="stroke:#181818;stroke-width:0.5;" x1="371" x2="689.166" y1="376.8516" y2="376.8516"/><ellipse cx="381" cy="390.5273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="389" y="394.3467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="371" x2="689.166" y1="401.2031" y2="401.2031"/><ellipse cx="381" cy="414.8789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="295.166" x="389" y="418.6982">task_id : bigint &#171;FK &#8594; recurring_tasks, CASCADE&#187;</text><ellipse cx="381" cy="431.2305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="86.7471" x="389" y="435.0498">done_on : date</text><ellipse cx="381" cy="447.582" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="142.3398" x="389" y="451.4014">created_at : timestamptz</text><line style="stroke:#181818;stroke-width:1;" x1="371" x2="689.166" y1="458.2578" y2="458.2578"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.8525" x="376" y="475.7529">UNIQUE (task_id, done_on)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="167.6416" x="376" y="492.1045">idx (task_id, done_on DESC)</text></g><!--class plan_items--><g class="entity" data-entity="plan_items" data-source-line="71" data-uid="ent0005" id="entity_plan_items"><rect fill="#FDF3D8" height="75.2305" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="160.8589" x="90.5" y="76.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="62.8672" x="139.4958" y="94.9951">plan_items</text><line style="stroke:#181818;stroke-width:0.5;" x1="91.5" x2="250.3589" y1="102.8516" y2="102.8516"/><ellipse cx="101.5" cy="116.5273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="109.5" y="120.3467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;" x1="91.5" x2="105.9009" y1="135.3789" y2="135.3789"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.0571" x="105.9009" y="140.1982">(see data-model.puml)</text><line style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;" x1="235.958" x2="250.3589" y1="135.3789" y2="135.3789"/></g><g class="entity" data-entity="GMN8" data-source-line="80" data-uid="ent0009" id="entity_GMN8"><path d="M725.5,378.5 L725.5,470.2578 A0,0 0 0 0 725.5,470.2578 L980.2969,470.2578 A0,0 0 0 0 980.2969,470.2578 L980.2969,388.5 L970.2969,378.5 L807,378.5 L803,221.29 L799,378.5 L725.5,378.5 A0,0 0 0 0 725.5,378.5" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M970.2969,378.5 L970.2969,388.5 L980.2969,388.5 L970.2969,378.5" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3862" x="731.5" y="396.9951">nextDue is never stored</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="36.1118" x="882.498" y="396.9951">&#8212; it is</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="233.7969" x="731.5" y="413.3467">last_done_on + interval_days, computed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="221.8442" x="731.5" y="429.6982">per request. A stored copy is a second</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.897" x="731.5" y="446.0498">source of truth that goes wrong the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="168.3462" x="731.5" y="462.4014">first time an interval is edited.</text></g><g class="entity" data-entity="GMN11" data-source-line="88" data-uid="ent0012" id="entity_GMN11"><path d="M28.5,628 L28.5,752.4609 A0,0 0 0 0 28.5,752.4609 L313.2197,752.4609 A0,0 0 0 0 313.2197,752.4609 L313.2197,638 L303.2197,628 L175,628 L171,568.13 L167,628 L28.5,628 A0,0 0 0 0 28.5,628" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M303.2197,628 L303.2197,638 L313.2197,638 L303.2197,628" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.7427" x="34.5" y="646.4951">plan_item_id is intent, not outcome.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7788" x="34.5" y="662.8467">This says what a morning was booked for;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="256.5469" x="34.5" y="679.1982">focus_sessions say what actually happened,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="252.2241" x="34.5" y="695.5498">and the gap between them is the interesting</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="263.7197" x="34.5" y="711.9014">number. SET NULL rather than CASCADE so</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="257.9814" x="34.5" y="728.2529">re-importing the plan cannot delete mornings</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="228.376" x="34.5" y="744.6045">already booked against a dropped item.</text></g><!--link tasks to completions--><g class="link" data-entity-1="tasks" data-entity-2="completions" data-source-line="76" data-uid="lnk6" id="link_tasks_completions"><path codeLine="76" d="M595.75,229.29 C595.75,271.89 595.75,293.82 595.75,332.44" fill="none" id="tasks-completions" style="stroke:#33475B;stroke-width:1;"/><line style="stroke:#33475B;stroke-width:1;" x1="591.75" x2="599.75" y1="225.29" y2="225.29"/><line style="stroke:#33475B;stroke-width:1;" x1="591.75" x2="599.75" y1="228.29" y2="228.29"/><line style="stroke:#33475B;stroke-width:1;" x1="595.75" x2="595.75" y1="229.29" y2="221.29"/><line style="stroke:#33475B;stroke-width:1;" x1="595.75" x2="601.75" y1="342.44" y2="350.44"/><line style="stroke:#33475B;stroke-width:1;" x1="595.75" x2="589.75" y1="342.44" y2="350.44"/><line style="stroke:#33475B;stroke-width:1;" x1="595.75" x2="595.75" y1="342.44" y2="350.44"/><ellipse cx="595.75" cy="336.44" fill="none" rx="4" ry="4" style="stroke:#33475B;stroke-width:1;"/></g><!--link plan_items to events--><g class="link" data-entity-1="plan_items" data-entity-2="events" data-source-line="77" data-uid="lnk7" id="link_plan_items_events"><path codeLine="77" d="M171,166.76 C171,199.25 171,215.26 171,262.82" fill="none" id="plan_items-events" style="stroke:#33475B;stroke-width:1;"/><line style="stroke:#33475B;stroke-width:1;" x1="171" x2="171" y1="162.76" y2="151.76"/><ellipse cx="171" cy="162.76" fill="none" rx="4" ry="4" style="stroke:#33475B;stroke-width:1;"/><line style="stroke:#33475B;stroke-width:1;" x1="167" x2="175" y1="155.76" y2="155.76"/><line style="stroke:#33475B;stroke-width:1;" x1="171" x2="177" y1="272.82" y2="280.82"/><line style="stroke:#33475B;stroke-width:1;" x1="171" x2="165" y1="272.82" y2="280.82"/><line style="stroke:#33475B;stroke-width:1;" x1="171" x2="171" y1="272.82" y2="280.82"/><ellipse cx="171" cy="266.82" fill="none" rx="4" ry="4" style="stroke:#33475B;stroke-width:1;"/><text fill="#1A2B3C" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="88.1816" x="72.7341" y="196.7851">booked against</text><text fill="#1A2B3C" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="107.6499" x="63" y="213.1367">(study blocks only)</text></g><!--SRC=[hLRRRjj647tNLmpS1rkgf3XMBaQI1f1rgGC7JXh7w4i1PKMkn8N8NMPtQOM92_If7r3q2_CbFREaB4frY