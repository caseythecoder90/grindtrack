<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="768px" preserveAspectRatio="none" style="width:742px;height:768px;background:#FFFFFF;" version="1.1" viewBox="0 0 742 768" width="742px" zoomAndPan="magnify"><defs/><g><!--cluster req--><g class="cluster" data-entity="req" data-source-line="17" data-uid="ent0002" id="cluster_req"><rect fill="none" height="758" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:1;" width="446" x="290" y="4"/><text fill="#12243A" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="430.752" x="297.624" y="18.0669">One request to the Messages API (sent again every round)</text></g><g class="entity" data-entity="GMN18" data-source-line="37" data-uid="ent0019" id="entity_GMN18"><path d="M11,318 L11,403.6641 A0,0 0 0 0 11,403.6641 L280.6631,403.6641 A0,0 0 0 0 280.6631,403.6641 L280.6631,365 L298.8237,361 L280.6631,357 L280.6631,328 L270.6631,318 L11,318 A0,0 0 0 0 11,318" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M270.6631,318 L270.6631,328 L280.6631,328 L270.6631,318" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.3125" x="17" y="335.0669">Opus 5 caches a prefix only from</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="240.4746" x="17" y="350.1997">512 tokens up; the tools and context</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.2515" x="17" y="365.3325">alone are past that. TTL five minutes,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="248.6631" x="17" y="380.4653">refreshed by every read &#8212; rounds are</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="96.0273" x="17" y="395.5981">seconds apart.</text></g><g class="entity" data-entity="GMN21" data-source-line="45" data-uid="ent0022" id="entity_GMN21"><path d="M6,597 L6,682.6641 A0,0 0 0 0 6,682.6641 L281.8013,682.6641 A0,0 0 0 0 281.8013,682.6641 L281.8013,644 L302.4398,640 L281.8013,636 L281.8013,607 L271.8013,597 L6,597 A0,0 0 0 0 6,597" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M271.8013,597 L271.8013,607 L281.8013,607 L271.8013,597" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="236.0313" x="12" y="614.0669">Why the same bytes matter: a clock</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.6392" x="12" y="629.1997">reading in the context, or tools in a</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.8013" x="12" y="644.3325">different order, would change segment</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.2686" x="12" y="659.4653">3 and silently miss every read.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.9434" x="12" y="674.5981">ContextServiceTest guards it.</text></g><!--entity t--><g class="entity" data-entity="t" data-source-line="18" data-uid="ent0003" id="entity_t"><rect fill="#E3F0FF" height="65.3984" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="371.6792" x="298" y="30"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.1357" x="308" y="52.0669">1. tools &#8212; six JSON schemas</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="351.6792" x="308" y="67.1997">get_plan, get_days, get_calendar, get_focus_sessions,</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.2925" x="308" y="82.3325">propose_week, propose_log</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="19" data-uid="ent0004" id="entity_s"><rect fill="#E3F0FF" height="50.2656" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="355.0293" x="302.5" y="131"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="193.9272" x="312.5" y="153.0669">2. system prompt &#8212; the rules</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="335.0293" x="312.5" y="168.1997">(read everything, draft only, never say 'scheduled')</text></g><!--entity c--><g class="entity" data-entity="c" data-source-line="20" data-uid="ent0005" id="entity_c"><rect fill="#E3F0FF" height="65.3984" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="304.7686" x="317.5" y="217"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.1152" x="327.5" y="239.0669">3. AssistantContext &#8212; this week, targets,</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="284.7686" x="327.5" y="254.1997">near plan items, next fortnight, recent days</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="262.3486" x="327.5" y="269.3325">(no timestamp: 'today' is the only clock)</text></g><!--entity bp1--><g class="entity" data-entity="bp1" data-source-line="21" data-uid="ent0006" id="entity_bp1"><rect fill="#FFE7BA" height="50.2656" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="320.314" x="299" y="336"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.314" x="309" y="358.0669">&#9733; explicit breakpoint on the last system block</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="287.5933" x="321.397" y="373.1997">covers 1 + 2 + 3 &#8212; changes once per TURN</text></g><!--entity h--><g class="entity" data-entity="h" data-source-line="22" data-uid="ent0007" id="entity_h"><rect fill="#E4F9EC" height="35.1328" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="270.3643" x="323" y="440"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="250.3643" x="333" y="462.0669">4. conversation history &#8212; earlier turns</text></g><!--entity r--><g class="entity" data-entity="r" data-source-line="23" data-uid="ent0008" id="entity_r"><rect fill="#E4F9EC" height="50.2656" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="317.9019" x="298" y="511"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.2529" x="308" y="533.0669">5. this turn's tool results so far</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="297.9019" x="308" y="548.1997">(all of a round's results in ONE user message)</text></g><!--entity bp2--><g class="entity" data-entity="bp2" data-source-line="24" data-uid="ent0009" id="entity_bp2"><rect fill="#FFE7BA" height="50.2656" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="304.8638" x="302.5" y="615"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="216.9438" x="312.5" y="637.0669">&#9733; automatic top-level breakpoint</text><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.4668" x="324.897" y="652.1997">covers 4 + 5 &#8212; changes once per ROUND</text></g><!--entity n--><g class="entity" data-entity="n" data-source-line="25" data-uid="ent0010" id="entity_n"><rect fill="#F0E9FF" height="35.1328" rx="2.5" ry="2.5" style="stroke:#33475B;stroke-width:0.5;" width="171.2964" x="369.5" y="719"/><text fill="#12243A" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.2964" x="379.5" y="741.0669">6. the newest message</text></g><g class="link" data-entity-1="t" data-entity-2="s" data-uid="lnk11" id="link_t_s"><polygon fill="#181818" points="481.0573,130.8145,485.4465,121.9978,481.2757,125.8193,477.4542,121.6484,481.0573,130.8145" style="stroke:#181818;stroke-width:1;"/><path d="M482.6122,95.2455 C482.1023,106.9107 481.7956,113.926 481.3193,124.8202" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="s" data-entity-2="c" data-uid="lnk12" id="link_s_c"><polygon fill="#181818" points="473.4751,216.7024,478.4293,208.1902,474.0184,211.732,470.4766,207.3211,473.4751,216.7024" style="stroke:#181818;stroke-width:1;"/><path d="M477.3726,181.0405 C476.1805,191.948 475.4061,199.0343 474.127,210.7379" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="c" data-entity-2="bp1" data-uid="lnk13" id="link_c_bp1"><polygon fill="#181818" points="461.4406,335.7048,466.3202,327.1497,461.9404,330.7298,458.3602,326.35,461.4406,335.7048" style="stroke:#181818;stroke-width:1;"/><path d="M466.8183,282.1719 C465.1052,299.226 463.6243,313.9667 462.0403,329.7348" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="bp1" data-entity-2="h" data-uid="lnk14" id="link_bp1_h"><polygon fill="#181818" points="458.1748,439.9819,462.2698,431.0248,458.2277,434.9822,454.2703,430.9401,458.1748,439.9819" style="stroke:#181818;stroke-width:1;"/><path d="M458.7425,386.3361 C458.5642,403.1797 458.3952,419.1494 458.2383,433.9823" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="h" data-entity-2="r" data-uid="lnk15" id="link_h_r"><polygon fill="#181818" points="457.3153,510.8819,461.4326,501.9349,457.3806,505.8823,453.4332,501.8304,457.3153,510.8819" style="stroke:#181818;stroke-width:1;"/><path d="M457.783,475.0994 C457.6463,485.558 457.5459,493.2372 457.3937,504.8824" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="r" data-entity-2="bp2" data-uid="lnk16" id="link_r_bp2"><polygon fill="#181818" points="455.4775,614.6475,459.6532,605.7276,455.5755,609.6484,451.6547,605.5708,455.4775,614.6475" style="stroke:#181818;stroke-width:1;"/><path d="M456.526,561.1726 C456.2095,577.3144 455.9124,592.4697 455.5951,608.6486" fill="none" style="stroke:#181818;stroke-width:1;"/></g><g class="link" data-entity-1="bp2" data-entity-2="n" data-uid="lnk17" id="link_bp2_n"><polygon fill="#181818" points="455,718.9819,459,709.9819,455,713.9819,451,709.9819,455,718.9819" style="stroke:#181818;stroke-width:1;"/><path d="M455,665.3361 C455,682.1797 455,698.149 455,712.9819" fill="none" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[RLNRRkCs47tNLqnt7vn57JMsuxqLA91a7RH5cnH95liIO45Bb4oO8bKE5SSj2lIbVr2W_P_-oNv9pr1Arcbjm00f3cVEd9ap_A8DgcuKMRNrNIHkT5HEPIFwi5AHlDDKo2BedplDaQptQoPhrXfd55UQDYReCIbNqcQbWqxVuiPJeGgiba6hTUkDYqniOWx7YpiTjd5bN4rgwUyqgHqhCYm1GwrB12Wq7Mo2YGWmoQVpV_vwaGB1kgIbAjOmrQgrMpeuoYSuXVS1bTFtdq5_-lrFKa3j9IIdy-KsQYO5lARKBff2sPokj2jrU4kiDPL6rK4r_5L87tDUPRmshbNuc6BNmNUkFFFM1tf-ddux5gMkL6VZkNVnsloYQJBRVtYX6atVQdkd1SEE3QzKwJT2KgKiwvsJe0kKgBQQVis8Jdq0l076R7RyQdwAh-9w-3QPJezd9zblEnwSZyFbFNcyVdVsNxTdhq_dBu_W8liS-zabMkE1uEWJgJzgPbM3rvEVlgC31g-aQcKSQIavfK0ldaa9S341sF4toU76MqxLOdDFtrzVNX2ZmetYMrVh-B6roer9LgNQShz2uL0W5VfTvOkEFp9m6EzuVElQu5lF-kD6w_MO7dRMrmb6fEUBsVaHAlS4oZGdtdBKZLneshw19C7GMGqi1wa1zMCVZwaCgXArsEqOhOS3OhMbaQ0lSQSSzMdp_dYpd4w0cB57rLoKtkr3GWqzyYYIY9AHqogGC47GHSFZljKh7w8pzIgEnR4mBnG1gaDfJ8CYgQPzIwFeyNqaAfDy130LrXVh7b-n7z-dl_yWVTzQKvYugzL1QrQX1GR2bkBirX5H0Ma7fWbzILFyPoaZIDj9WoHfjw3fvltLHGgzR2VIVejNfoTFWn_dSEN4bueeAe6JwD5DuWvKM0CliGkEaviLCZW-VxCuU-fadlTaYk68KwFXc2525CL3OW5KAMl9LnX7gL57_6Y13hwyM5372DNqFJwqyVvemfVgec-0k42mzj2Y9-mETRiC7OET-NvshYxVNxmRw9dkf-TbFioxZGXnG9UkE5muMhn1CI7SI8SO9-xm6-AC7zT5LZokKO1CYl2mNsMhntN8mexTD1Cq3tkNPMcU1Ea-uKyS4Lss7IEjz0fWq499keAeKyTLK1LCvfCfo5bhnzIrN_SFHve0CkEBNWSmKrPU8HdLhJHQn7EKqytD3rGPF1wDSHr6-JYnKg5YK1oc-yF84