" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.9707" x="629.5" y="288.4014">updated_at : timestamptz</text></g><g class="entity" data-entity="GMN10" data-source-line="61" data-uid="ent0011" id="entity_GMN10"><path d="M667,416.5 L667,491.9063 A0,0 0 0 0 667,491.9063 L992.1797,491.9063 A0,0 0 0 0 992.1797,491.9063 L992.1797,426.5 L982.1797,416.5 L833.5,416.5 L829.5,295.618 L825.5,416.5 L667,416.5 A0,0 0 0 0 667,416.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M982.1797,416.5 L982.1797,426.5 L992.1797,426.5 L982.1797,416.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="304.1797" x="673" y="434.9951">Two watermarks per person, not a row per message:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="264.3037" x="673" y="451.3467">"seen" under my last message is their read_id</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="244.2388" x="673" y="467.6982">having passed it. Forward only, never past</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.8462" x="673" y="484.0498">the newest message.</text></g><g class="link" data-entity-1="users" data-entity-2="msgs" data-uid="lnk6" id="link_users_msgs"><line style="stroke:#33475B;stroke-width:1;" x1="476.5583" x2="480.79" y1="101.7434" y2="108.5326"/><line style="stroke:#33475B;stroke-width:1;" x1="474.0124" x2="478.244" y1="103.3303" y2="110.1195"/><line style="stroke:#33475B;stroke-width:1;" x1="475.2796" x2="482.0688" y1="107.2538" y2="103.0222"/><line style="stroke:#33475B;stroke-width:1;" x1="399.1065" x2="395.491" y1="154.7316" y2="164.0551"/><line style="stroke:#33475B;stroke-width:1;" x1="399.1065" x2="389.1436" y1="154.7316" y2="153.8713"/><line style="stroke:#33475B;stroke-width:1;" x1="399.1065" x2="392