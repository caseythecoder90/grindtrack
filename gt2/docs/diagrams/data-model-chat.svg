mily="Helvetica" font-size="13" lengthAdjust="spacing" textLength="103.3271" x="12" y="316.9561">idx (sender_id, id)</text></g><!--class reacts--><g class="entity" data-entity="reacts" data-source-line="36" data-uid="ent0004" id="entity_reacts"><rect fill="#E6F7EE" height="148.4609" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="351.2568" x="245" y="380"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="84.5508" x="378.353" y="398.4951">chat_reactions</text><line style="stroke:#181818;stroke-width:0.5;" x1="246" x2="595.2568" y1="406.3516" y2="406.3516"/><ellipse cx="256" cy="420.0273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="264" y="423.8467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="246" x2="595.2568" y1="430.7031" y2="430.7031"/><ellipse cx="256" cy="444.3789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="326.2568" x="264" y="448.1982">message_id : bigint &#171;FK &#8594; chat_messages, CASCADE&#187;</text><ellipse cx="256" cy="460.7305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="239.5352" x="264" y="464.5498">user_id : bigint &#171;FK &#8594; users, CASCADE&#187;</text><ellipse cx="256" cy="477.082" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.3672" x="264" y="480.9014">emoji : varchar(32)</text><ellipse cx="256" cy="493.4336" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthA