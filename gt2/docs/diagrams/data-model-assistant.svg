<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="580px" preserveAspectRatio="none" style="width:1184px;height:580px;background:#FFFFFF;" version="1.1" viewBox="0 0 1184 580" width="1184px" zoomAndPan="magnify"><defs/><g><!--class reports--><g class="entity" data-entity="reports" data-source-line="22" data-uid="ent0002" id="entity_reports"><rect fill="#E3F0FF" height="245.8594" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="367.7163" x="6" y="12"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.5601" x="134.0781" y="29.0669">assistant_reports</text><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="372.7163" y1="37.1328" y2="37.1328"/><ellipse cx="17" cy="50.1992" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.8413" x="25" y="53.1997">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="372.7163" y1="60.2656" y2="60.2656"/><ellipse cx="17" cy="73.332" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.5967" x="25" y="76.3325">kind : varchar(30)  CHECK</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="342.7163" x="25" y="91.4653">weekly_review | week_plan | day_log | morning_brief</text><ellipse cx="17" cy="103.5977" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="274.0283" x="25" y="106.5981">week_start : date  (the start of the period:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.0122" x="25" y="121.731">a Monday for a review or plan, the day itself</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.4399" x="25" y="136.8638">for a log or a brief)</text><ellipse cx="17" cy="148.9961" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.397" x="25" y="151.9966">generated_at : timestamptz</text><ellipse cx="17" cy="164.1289" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.5112" x="25" y="167.1294">model : varchar(60)</text><ellipse cx="17" cy="179.2617" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.8496" x="25" y="182.2622">input_tokens / output_tokens : bigint</text><ellipse cx="17" cy="194.3945" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.022" x="25" y="197.395">draft_json : text  (the structured draft, exactly</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="323.8193" x="25" y="212.5278">as the model filled it &#8212; shape lives in *Draft.java)</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="372.7163" y1="219.5938" y2="219.5938"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="330.3955" x="12" y="235.6606">UNIQUE (kind, week_start)  &#8594; one draft per period,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.9019" x="12" y="250.7935">a redraft replaces</text></g><!--class convs--><g class="entity" data-entity="convs" data-source-line="40" data-uid="ent0003" id="entity_convs"><rect fill="#E3F0FF" height="101.6641" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="366.5801" x="421.5" y="84"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.5874" x="526.9963" y="101.0669">assistant_conversations</text><line style="stroke:#181818;stroke-width:0.5;" x1="422.5" x2="787.0801" y1="109.1328" y2="109.1328"/><ellipse cx="432.5" cy="122.1992" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.8413" x="440.5" y="125.1997">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="422.5" x2="787.0801" y1="132.2656" y2="132.2656"/><ellipse cx="432.5" cy="145.332" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="341.5801" x="440.5" y="148.3325">title : varchar(120)  (first words of the first question)</text><ellipse cx="432.5" cy="160.4648" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.0552" x="440.5" y="163.4653">created_at : timestamptz</text><ellipse cx="432.5" cy="175.5977" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="202.6235" x="440.5" y="178.5981">last_message_at : timestamptz</text></g><!--class msgs--><g class="entity" data-entity="msgs" data-source-line="48" data-uid="ent0004" id="entity_msgs"><rect fill="#E3F0FF" height="260.9922" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="458.5576" x="375.5" y="313"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.9937" x="539.782" y="330.0669">assistant_messages</text><line style="stroke:#181818;stroke-width:0.5;" x1="376.5" x2="833.0576" y1="338.1328" y2="338.1328"/><ellipse cx="386.5" cy="351.1992" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.8413" x="394.5" y="354.1997">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="376.5" x2="833.0576" y1="361.2656" y2="361.2656"/><ellipse cx="386.5" cy="374.332" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="433.5576" x="394.5" y="377.3325">conversation_id : bigint &#171;FK &#8594; assistant_conversations, CASCADE&#187;</text><ellipse cx="386.5" cy="389.4648" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="270.3022" x="394.5" y="392.4653">role : varchar(12)  CHECK user | assistant</text><ellipse cx="386.5" cy="404.5977" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="301.5454" x="394.5" y="407.5981">content : text  (text turns only &#8212; tool calls are</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="281.5439" x="394.5" y="422.731">not replayed, the answer they produced is)</text><ellipse cx="386.5" cy="434.8633" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="238.8496" x="394.5" y="437.8638">input_tokens / output_tokens : bigint</text><ellipse cx="386.5" cy="449.9961" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="314.7739" x="394.5" y="452.9966">cache_write_tokens / cache_read_tokens : bigint</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.6938" x="394.5" y="468.1294">(billed at 1.25&#215; and 0.1&#215;, so kept apart)</text><ellipse cx="386.5" cy="480.2617" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.0552" x="394.5" y="483.2622">created_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="314.6851" x="394.5" y="498.395">proposed_week_start : date  (which Monday this</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="137.1538" x="394.5" y="513.5278">turn drafted, if it did)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="303.0244" x="394.5" y="528.6606">proposed_log_date : date  (which day this turn</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.1567" x="394.5" y="543.7935">drafted a log for, if it did)</text><line style="stroke:#181818;stroke-width:1;" x1="376.5" x2="833.0576" y1="550.8594" y2="550.8594"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="136.2144" x="381.5" y="566.9263">idx (conversation_id)</text></g><!--class subs--><g class="entity" data-entity="subs" data-source-line="67" data-uid="ent0005" id="entity_subs"><rect fill="#F0E9FF" height="162.1953" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="329.7383" x="848" y="54"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.0713" x="950.8335" y="71.0669">push_subscriptions</text><line style="stroke:#181818;stroke-width:0.5;" x1="849" x2="1176.7383" y1="79.1328" y2="79.1328"/><ellipse cx="859" cy="92.1992" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.8413" x="867" y="95.1997">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="849" x2="1176.7383" y1="102.2656" y2="102.2656"/><ellipse cx="859" cy="115.332" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="286.8252" x="867" y="118.3325">endpoint : text  UNIQUE  (the push service's</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="258.6733" x="867" y="133.4653">address for one browser on one device)</text><ellipse cx="859" cy="145.5977" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="292.7856" x="867" y="148.5981">p256dh : text  (device public key, base64url)</text><ellipse cx="859" cy="160.7305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.3379" x="867" y="163.731">auth : text  (device auth secret, base64url)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="304.7383" x="867" y="178.8638">user_agent : text  ("iPhone &#183; Safari (installed)")</text><ellipse cx="859" cy="190.9961" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="164.0552" x="867" y="193.9966">created_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="172.3071" x="867" y="209.1294">last_sent_at : timestamptz</text></g><g class="entity" data-entity="GMN7" data-source-line="82" data-uid="ent0008" id="entity_GMN7"><path d="M23,393 L23,493.7969 A0,0 0 0 0 23,493.7969 L356.9014,493.7969 A0,0 0 0 0 356.9014,493.7969 L356.9014,403 L346.9014,393 L194,393 L190,258.0176 L186,393 L23,393 A0,0 0 0 0 23,393" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M346.9014,393 L346.9014,403 L356.9014,403 L346.9014,393" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.5791" x="29" y="410.0669">A model writes here and nowhere else.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="312.9014" x="29" y="425.1997">Accepting a week_plan inserts calendar_events;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="284.8574" x="29" y="440.3325">accepting a day_log merges into daily_logs.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.2446" x="29" y="455.4653">The turn that drafted points at the row by</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="269.5215" x="29" y="470.5981">date, not by id, so the card always shows</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="221.7935" x="29" y="485.731">what accepting will actually write.</text></g><g class="entity" data-entity="GMN10" data-source-line="91" data-uid="ent0011" id="entity_GMN10"><path d="M852.5,416 L852.5,471.3984 A0,0 0 0 0 852.5,471.3984 L1173.814,471.3984 A0,0 0 0 0 1173.814,471.3984 L1173.814,426 L1163.814,416 L1017,416 L1013,216.1289 L1009,416 L852.5,416 A0,0 0 0 0 852.5,416" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M1163.814,416 L1163.814,426 L1173.814,426 L1163.814,416" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.314" x="858.5" y="433.0669">One account, so no owner column &#8212; on every</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="264.2847" x="858.5" y="448.1997">table here. The day a second user exists</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.1567" x="858.5" y="463.3325">it is a known change.</text></g><g class="link" data-entity-1="convs" data-entity-2="msgs" data-uid="lnk6" id="link_convs_msgs"><line style="stroke:#33475B;stroke-width:1;" x1="601" x2="609" y1="190.269" y2="190.269"/><line style="stroke:#33475B;stroke-width:1;" x1="601" x2="609" y1="193.269" y2="193.269"/><line style="stroke:#33475B;stroke-width:1;" x1="605" x2="605" y1="194.269" y2="186.269"/><line style="stroke:#33475B;stroke-width:1;" x1="605" x2="611" y1="304.8383" y2="312.8383"/><line style="stroke:#33475B;stroke-width:1;" x1="605" x2="599" y1="304.8383" y2="312.8383"/><line style="stroke:#33475B;stroke-width:1;" x1="605" x2="605" y1="304.8383" y2="312.8383"/><ellipse cx="605" cy="298.8383" fill="none" rx="4" ry="4" style="stroke:#33475B;stroke-width:1;"/><path d="M605,194.269 C605,228.7446 605,250.1616 605,294.8383" fill="none" style="stroke:#33475B;stroke-width:1;"/><text fill="#1A2B3C" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="22.9785" x="607" y="290.0669">has</text></g><!--SRC=[dLRDSXD74BxhAJhE0OcIXN-m8OQYoXPMI54X98Ip6Essj1EFPZOpiv85JbLEUO1KgdYKtCERy2JvUdPbBq9K0hvuDTFpTK_trr_FLwLNixaYerQkYXJc79LLdLlqhTSsZrvb5vIhg6ZkSZRq_lU_A1PCAWGTO1dxf6oUbih2MGwa8sNAacUL5THzxaASUIo7h62uUJMxXdtL6y3DppZ9qwdpyArp9Wq4cppk9e-3ifgR1_1kUTK7gb5HEniANIR7cJ9iS-Nb48BGdjpIqbGR3eB-4pRPdr1WfbohcLVpSCUdnK4eEeLupBJF37V2XRQbWW4PRJckIYO4LRZMnWHHpxohR3vqnddwUfJ-MXOvJrLbuiZP-4A_Pje_tBxvJCsPdh1PSDIPQjc4GkLkgUsCfig4TbIdthjbu_VmyEwzexFDJG5k3FPF3yuEXoq3jb775Rtf49rjtkByV7GmkYSxpYCn7_eWQiCU7DmzFEtyrWAsBl9sM6Jc_kFX9kpm_jdHyHuWEar8