<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="617px" preserveAspectRatio="none" style="width:1299px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 1299 617" width="1299px" zoomAndPan="magnify"><defs/><g><!--class reports--><g class="entity" data-entity="reports" data-source-line="22" data-uid="ent0002" id="entity_reports"><rect fill="#E3F0FF" height="262.9219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="328.5132" x="6" y="12"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="98.9917" x="120.7607" y="30.4951">assistant_reports</text><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="333.5132" y1="38.3516" y2="38.3516"/><ellipse cx="17" cy="52.0273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="25" y="55.8467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="333.5132" y1="62.7031" y2="62.7031"/><ellipse cx="17" cy="76.3789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="153.8799" x="25" y="80.1982">kind : varchar(30)  CHECK</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="303.5132" x="25" y="96.5498">weekly_review | week_plan | day_log | morning_brief</text><ellipse cx="17" cy="109.082" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.0151" x="25" y="112.9014">week_start : date  (the start of the period:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="251.4624" x="25" y="129.2529">a Monday for a review or plan, the day itself</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="106.2153" x="25" y="145.6045">for a log or a brief)</text><ellipse cx="17" cy="158.1367" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.5298" x="25" y="161.9561">generated_at : timestamptz</text><ellipse cx="17" cy="174.4883" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="112.709" x="25" y="178.3076">model : varchar(60)</text><ellipse cx="17" cy="190.8398" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.146" x="25" y="194.6592">input_tokens / output_tokens : bigint</text><ellipse cx="17" cy="207.1914" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="257.2261" x="25" y="211.0107">draft_json : text  (the structured draft, exactly</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="282.5151" x="25" y="227.3623">as the model filled it &#8212; shape lives in *Draft.java)</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="333.5132" y1="234.2188" y2="234.2188"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="295.8896" x="12" y="251.7139">UNIQUE (kind, week_start)  &#8594; one draft per period,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="101.1626" x="12" y="268.0654">a redraft replaces</text></g><!--class convs--><g class="entity" data-entity="convs" data-source-line="40" data-uid="ent0003" id="entity_convs"><rect fill="#E3F0FF" height="107.7578" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="318.3252" x="389.5" y="89.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.7407" x="479.2922" y="107.9951">assistant_conversations</text><line style="stroke:#181818;stroke-width:0.5;" x1="390.5" x2="706.8252" y1="115.8516" y2="115.8516"/><ellipse cx="400.5" cy="129.5273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="408.5" y="133.3467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="390.5" x2="706.8252" y1="140.2031" y2="140.2031"/><ellipse cx="400.5" cy="153.8789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="293.3252" x="408.5" y="157.6982">title : varchar(120)  (first words of the first question)</text><ellipse cx="400.5" cy="170.2305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="142.3398" x="408.5" y="174.0498">created_at : timestamptz</text><ellipse cx="400.5" cy="186.582" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="179.188" x="408.5" y="190.4014">last_message_at : timestamptz</text></g><!--class msgs--><g class="entity" data-entity="msgs" data-source-line="48" data-uid="ent0004" id="entity_msgs"><rect fill="#E3F0FF" height="279.2734" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="419.9067" x="338.5" y="331"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.7808" x="489.563" y="349.4951">assistant_messages</text><line style="stroke:#181818;stroke-width:0.5;" x1="339.5" x2="757.4067" y1="357.3516" y2="357.3516"/><ellipse cx="349.5" cy="371.0273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="357.5" y="374.8467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="339.5" x2="757.4067" y1="381.7031" y2="381.7031"/><ellipse cx="349.5" cy="395.3789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="394.9067" x="357.5" y="399.1982">conversation_id : bigint &#171;FK &#8594; assistant_conversations, CASCADE&#187;</text><ellipse cx="349.5" cy="411.7305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.5122" x="357.5" y="415.5498">role : varchar(12)  CHECK user | assistant</text><ellipse cx="349.5" cy="428.082" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="260.1143" x="357.5" y="431.9014">content : text  (text turns only &#8212; tool calls are</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="245.6987" x="357.5" y="448.2529">not replayed, the answer they produced is)</text><ellipse cx="349.5" cy="460.7852" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="208.146" x="357.5" y="464.6045">input_tokens / output_tokens : bigint</text><ellipse cx="349.5" cy="477.1367" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="281.1187" x="357.5" y="480.9561">cache_write_tokens / cache_read_tokens : bigint</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.9287" x="357.5" y="497.3076">(billed at 1.25&#215; and 0.1&#215;, so kept apart)</text><ellipse cx="349.5" cy="509.8398" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="142.3398" x="357.5" y="513.6592">created_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.9287" x="357.5" y="530.0107">proposed_week_start : date  (which Monday this</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="115.6099" x="357.5" y="546.3623">turn drafted, if it did)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="266.6714" x="357.5" y="562.7139">proposed_log_date : date  (which day this turn</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.1816" x="357.5" y="579.0654">drafted a log for, if it did)</text><line style="stroke:#181818;stroke-width:1;" x1="339.5" x2="757.4067" y1="585.9219" y2="585.9219"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.9453" x="344.5" y="603.417">idx (conversation_id)</text></g><!--class subs--><g class="entity" data-entity="subs" data-source-line="67" data-uid="ent0005" id="entity_subs"><rect fill="#F0E9FF" height="189.5156" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="566.8994" x="726" y="48.5"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.2871" x="953.8062" y="66.9951">push_subscriptions</text><line style="stroke:#181818;stroke-width:0.5;" x1="727" x2="1291.8994" y1="74.8516" y2="74.8516"/><ellipse cx="737" cy="88.5273" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="745" y="92.3467">id : bigint &#171;PK, identity&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="727" x2="1291.8994" y1="99.2031" y2="99.2031"/><ellipse cx="737" cy="112.8789" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="541.8994" x="745" y="116.6982">user_id : bigint &#171;FK &#8594; users, CASCADE&#187;  (whose device; the schedulers push to the owner's)</text><ellipse cx="737" cy="129.2305" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.6489" x="745" y="133.0498">endpoint : text  UNIQUE  (the push service's</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="229.0742" x="745" y="149.4014">address for one browser on one device)</text><ellipse cx="737" cy="161.9336" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.3696" x="745" y="165.7529">p256dh : text  (device public key, base64url)</text><ellipse cx="737" cy="178.2852" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="242.7979" x="745" y="182.1045">auth : text  (device auth secret, base64url)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="267.9092" x="745" y="198.4561">user_agent : text  ("iPhone &#183; Safari (installed)")</text><ellipse cx="737" cy="210.9883" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="142.3398" x="745" y="214.8076">created_at : timestamptz</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.0107" x="745" y="231.1592">last_sent_at : timestamptz</text></g><g class="entity" data-entity="GMN7" data-source-line="83" data-uid="ent0008" id="entity_GMN7"><path d="M21,416.5 L21,524.6094 A0,0 0 0 0 21,524.6094 L320.2241,524.6094 A0,0 0 0 0 320.2241,524.6094 L320.2241,426.5 L310.2241,416.5 L174.5,416.5 L170.5,275.2851 L166.5,416.5 L21,416.5 A0,0 0 0 0 21,416.5" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M310.2241,416.5 L310.2241,426.5 L320.2241,426.5 L310.2241,416.5" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.7324" x="27" y="434.9951">A model writes here and nowhere else.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.2241" x="27" y="451.3467">Accepting a week_plan inserts calendar_events;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="252.2114" x="27" y="467.6982">accepting a day_log merges into daily_logs.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="234.1333" x="27" y="484.0498">The turn that drafted points at the row by</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.0151" x="27" y="500.4014">date, not by id, so the card always shows</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="190.7471" x="27" y="516.7529">what accepting will actually write.</text></g><g class="entity" data-entity="GMN10" data-source-line="92" data-uid="ent0011" id="entity_GMN10"><path d="M865.5,441 L865.5,500.0547 A0,0 0 0 0 865.5,500.0547 L1153.8633,500.0547 A0,0 0 0 0 1153.8633,500.0547 L1153.8633,451 L1143.8633,441 L1013.5,441 L1009.5,238.5035 L1005.5,441 L865.5,441 A0,0 0 0 0 865.5,441" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><path d="M1143.8633,441 L1143.8633,451 L1153.8633,451 L1143.8633,441" fill="#FFF8DC" style="stroke:#C8B560;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="267.3633" x="871.5" y="459.4951">One account, so no owner column &#8212; on every</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="234.1333" x="871.5" y="475.8467">table here. The day a second user exists</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="121.4053" x="871.5" y="492.1982">it is a known change.</text></g><g class="link" data-entity-1="convs" data-entity-2="msgs" data-uid="lnk6" id="link_convs_msgs"><line style="stroke:#33475B;stroke-width:1;" x1="544.5" x2="552.5" y1="201.8032" y2="201.8032"/><line style="stroke:#33475B;stroke-width:1;" x1="544.5" x2="552.5" y1="204.8032" y2="204.8032"/><line style="stroke:#33475B;stroke-width:1;" x1="548.5" x2="548.5" y1="205.8032" y2="197.8032"/><line style="stroke:#33475B;stroke-width:1;" x1="548.5" x2="554.5" y1="322.9615" y2="330.9615"/><line style="stroke:#33475B;stroke-width:1;" x1="548.5" x2="542.5" y1="322.9615" y2="330.9615"/><line style="stroke:#33475B;stroke-width:1;" x1="548.5" x2="548.5" y1="322.9615" y2="330.9615"/><ellipse cx="548.5" cy="316.9615" fill="none" rx="4" ry="4" style="stroke:#33475B;stroke-width:1;"/><path d="M548.5,205.8032 C548.5,242.0896 548.5,265.8965 548.5,312.9615" fill="none" style="stroke:#33475B;stroke-width:1;"/><text fill="#1A2B3C" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.96" x="550.5" y="308.4951">has</text></g><!--SRC=[dLR1RXit4BthAwRk8N8WAxOSEwaJ1B0Lgoc2fcdJd1LgTwHbJP5RaYjPYGlqr0ye2kHJUc_-95_IDzoLlL4Kj8akufB