spring:
  application:
    name: grindtrack
  threads:
    virtual:
      enabled: true   # Java 21 virtual threads: every request runs on a virtual thread
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grindtrack}
    username: ${SPRING_DATASOURCE_USERNAME:grind}
    password: ${SPRING_DATASOURCE_PASSWORD:grind}
  jpa:
    hibernate:
      ddl-auto: validate   # Liquibase owns the schema; Hibernate only validates
    properties:
      hibernate:
        default_schema: grindtrack
  servlet:
    multipart:
      # Must not be below the limit StatementImportController enforces, or files between the two
      # sizes fail with a raw container error instead of the message written for them.
      max-file-size: 5MB
      max-request-size: 6MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: grindtrack

preliquibase:
  enabled: true   # runs classpath:preliquibase/postgresql.sql before Liquibase

grindtrack:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  # The access cookie is the one on the wire constantly, so it stays short. Thirty minutes
  # rather than fifteen halves the renewals without meaningfully widening the window in which a
  # stolen access token is worth anything -- it is not revocable, which is why it expires fast.
  access-token-minutes: 30
  # The session. Sliding: every renewal pushes it out again, so an app opened most days never
  # expires and one abandoned for three months does. Fourteen days meant a fortnight away from
  # the ThinkPad cost a full password and TOTP login on it.
  refresh-token-days: 90
  # How old a session token gets before it is replaced rather than merely renewed. Daily, so a
  # leaked token stops working within a day, while an ordinary week costs seven rotations instead
  # of several hundred.
  refresh-rotate-hours: 24
  # How long a browser is remembered as having already passed the second factor. Thirty days is
  # the usual figure, and it slides on every sign-in, so a machine in regular use stays trusted.
  # The password is still required every time; only the authenticator code is skipped.
  trusted-device-days: 30
  cookie-secure: ${COOKIE_SECURE:false}
  # The assistant. No key means off: the endpoints answer 503 with a sentence and the Friday
  # job stays quiet, so this can deploy before the Kubernetes secret exists.
  assistant:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    # "Friday at five" means the owner's Friday. Spring cron: second minute hour day month weekday.
    zone: America/New_York
    review-cron: "0 0 17 * * FRI"
    # Before the morning block. Every day: a Saturday brief that says "nothing booked" costs two
    # cents and is the honest answer, and weekends are when plans get reconsidered.
    brief-cron: "0 0 6 * * *"
  # Push notifications. No VAPID pair means off: the status endpoint says so, subscribing answers
  # 503 with a sentence, and the schedulers skip their push line. docs/push-notifications.md has
  # the one-liner that generates the pair.
  push:
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:mailto:grindtrack@example.invalid}
  # Speech to text for the ask box. No key means off: the mic button is not rendered and the
  # socket refuses with a sentence. gpt-4o-mini-transcribe is about a third of a cent a minute and
  # transcribes each phrase once you pause; gpt-live-transcribe streams word by word at several
  # times the price — one line to switch.
  speech:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini-transcribe
    language: en
  bootstrap-username: ${GRINDTRACK_USERNAME:}
  bootstrap-password: ${GRINDTRACK_PASSWORD:}

server:
  port: 8080
